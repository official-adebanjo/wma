name: QA automation

# QA Strategy §13: commit → shift-left API → shift-right UI on real devices → TestRail → Jira.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      mobile_suite:
        description: 'WDIO suite (auth, navigation, journeys, kyc, wallet, grow, reap, rwin, rtn, borrow, nano, payday, personal, publicSector, resilience) or "all"'
        default: 'all'
  schedule:
    - cron: '0 1 * * 1-5' # nightly full regression, 02:00 WAT

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ENV: ${{ vars.TEST_ENV || 'dev' }}
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  ADMIN_BASE_URL: ${{ vars.ADMIN_BASE_URL }}
  QA_HOOKS_BASE_URL: ${{ vars.QA_HOOKS_BASE_URL }}
  QA_HOOKS_TOKEN: ${{ secrets.QA_HOOKS_TOKEN }}
  TEST_OTP: ${{ secrets.TEST_OTP }}

jobs:
  static-and-oracle:
    name: Type-check + calculation oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright test --project=unit
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: oracle-junit, path: reports/playwright-junit }

  api:
    name: Shift-left API contract
    needs: static-and-oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright test --project=api
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: api-junit, path: reports/playwright-junit }

  admin:
    name: Admin portal E2E
    needs: api
    # The full admin suite (admin/specs) targets the build that carries the selector contract
    # (docs/SELECTOR-CONTRACT.md). It runs once the ADMIN_BASE_URL repository variable points at it;
    # the live dev portal is covered by the dev-portal-report job below.
    if: vars.ADMIN_BASE_URL != ''
    runs-on: ubuntu-latest
    env:
      ADMIN_BASE_URL: ${{ vars.ADMIN_BASE_URL }}
      ADMIN_SUPER_ADMIN_EMAIL: ${{ secrets.ADMIN_SUPER_ADMIN_EMAIL }}
      ADMIN_SUPER_ADMIN_PASSWORD: ${{ secrets.ADMIN_SUPER_ADMIN_PASSWORD }}
      ADMIN_COMPLIANCE_EMAIL: ${{ secrets.ADMIN_COMPLIANCE_EMAIL }}
      ADMIN_COMPLIANCE_PASSWORD: ${{ secrets.ADMIN_COMPLIANCE_PASSWORD }}
      ADMIN_KYC_REVIEWER_EMAIL: ${{ secrets.ADMIN_KYC_REVIEWER_EMAIL }}
      ADMIN_KYC_REVIEWER_PASSWORD: ${{ secrets.ADMIN_KYC_REVIEWER_PASSWORD }}
      ADMIN_TREASURY_OFFICER_EMAIL: ${{ secrets.ADMIN_TREASURY_OFFICER_EMAIL }}
      ADMIN_TREASURY_OFFICER_PASSWORD: ${{ secrets.ADMIN_TREASURY_OFFICER_PASSWORD }}
      ADMIN_HEAD_OF_CRM_EMAIL: ${{ secrets.ADMIN_HEAD_OF_CRM_EMAIL }}
      ADMIN_HEAD_OF_CRM_PASSWORD: ${{ secrets.ADMIN_HEAD_OF_CRM_PASSWORD }}
      ADMIN_HEAD_OF_OPS_EMAIL: ${{ secrets.ADMIN_HEAD_OF_OPS_EMAIL }}
      ADMIN_HEAD_OF_OPS_PASSWORD: ${{ secrets.ADMIN_HEAD_OF_OPS_PASSWORD }}
      ADMIN_HEAD_OF_CREDIT_EMAIL: ${{ secrets.ADMIN_HEAD_OF_CREDIT_EMAIL }}
      ADMIN_HEAD_OF_CREDIT_PASSWORD: ${{ secrets.ADMIN_HEAD_OF_CREDIT_PASSWORD }}
      ADMIN_LOAN_ACCOUNT_OFFICER_EMAIL: ${{ secrets.ADMIN_LOAN_ACCOUNT_OFFICER_EMAIL }}
      ADMIN_LOAN_ACCOUNT_OFFICER_PASSWORD: ${{ secrets.ADMIN_LOAN_ACCOUNT_OFFICER_PASSWORD }}
      ADMIN_MARKETING_EMAIL: ${{ secrets.ADMIN_MARKETING_EMAIL }}
      ADMIN_MARKETING_PASSWORD: ${{ secrets.ADMIN_MARKETING_PASSWORD }}
      # …add the remaining personas from .env.example as repository secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Smoke on PRs, full regression on main / nightly
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx playwright test --project=admin-chromium --grep "@smoke|@crit"
          else
            npx playwright test --project=admin-chromium --project=admin-firefox
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: admin-report, path: reports/ }

  mobile-cloud:
    name: Mobile on TestMu AI / LambdaTest real devices
    needs: api
    # Runs once LambdaTest is set up: LT_USERNAME / LT_ACCESS_KEY secrets and the uploaded app's
    # LT_APP_ID_ANDROID variable. Until then the emulator job (mobile-dev) covers the mobile app.
    if: github.event_name != 'pull_request' && vars.LT_APP_ID_ANDROID != ''
    runs-on: ubuntu-latest
    env:
      LT_USERNAME: ${{ secrets.LT_USERNAME }}
      LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
      LT_APP_ID_ANDROID: ${{ vars.LT_APP_ID_ANDROID }}
      LT_APP_ID_IOS: ${{ vars.LT_APP_ID_IOS }}
      LT_PARALLEL_SESSIONS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Run WDIO suite
        run: |
          SUITE="${{ github.event.inputs.mobile_suite || 'all' }}"
          if [ "$SUITE" = "all" ]; then npm run test:mobile:cloud; else npx wdio run mobile/config/wdio.lambdatest.conf.ts --suite "$SUITE"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mobile-report, path: reports/ }

  testrail:
    name: Publish results to TestRail
    needs: [admin, mobile-cloud]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: results }
      - name: Upload JUnit to TestRail (trcli)
        env:
          TR_HOST: ${{ vars.TESTRAIL_HOST }}
          TR_USER: ${{ secrets.TESTRAIL_USER }}
          TR_KEY: ${{ secrets.TESTRAIL_API_KEY }}
          TR_PROJECT: ${{ vars.TESTRAIL_PROJECT }}
        run: |
          pip install trcli
          for f in $(find results -name "*.xml"); do
            trcli -y -h "$TR_HOST" --project "$TR_PROJECT" -u "$TR_USER" -k "$TR_KEY" \
              parse_junit --title "CI ${{ github.run_number }} (${{ github.ref_name }})" \
              --case-matcher name -f "$f" || true
          done

  mobile-dev:
    name: Mobile app on an Android emulator (dev build)
    # Uses shared dev customer accounts — not on PRs. Results feed the summary page's Mobile app tab.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MOBILE_ID_STRATEGY: resource-id
      APP_PACKAGE: com.optisoft.rosabon
      ANDROID_APP_PATH: ./apps/rosabon-dev.apk
      MOBILE_HOLD_PERSONAS: ${{ vars.MOBILE_HOLD_PERSONAS }}
      MOBILE_SUITES: ${{ (github.event.inputs.mobile_suite && github.event.inputs.mobile_suite != 'all') && github.event.inputs.mobile_suite || 'auth navigation journeys' }}
      CUSTOMER_T1_EMAIL: ${{ secrets.CUSTOMER_T1_EMAIL }}
      CUSTOMER_T1_PASSWORD: ${{ secrets.CUSTOMER_T1_PASSWORD }}
      CUSTOMER_T1_PHONE: ${{ secrets.CUSTOMER_T1_PHONE }}
      CUSTOMER_T1_PIN: ${{ secrets.CUSTOMER_T1_PIN }}
      CUSTOMER_T2_EMAIL: ${{ secrets.CUSTOMER_T2_EMAIL }}
      CUSTOMER_T2_PASSWORD: ${{ secrets.CUSTOMER_T2_PASSWORD }}
      CUSTOMER_T2_PHONE: ${{ secrets.CUSTOMER_T2_PHONE }}
      CUSTOMER_T2_PIN: ${{ secrets.CUSTOMER_T2_PIN }}
      CUSTOMER_T3_EMAIL: ${{ secrets.CUSTOMER_T3_EMAIL }}
      CUSTOMER_T3_PASSWORD: ${{ secrets.CUSTOMER_T3_PASSWORD }}
      CUSTOMER_T3_PHONE: ${{ secrets.CUSTOMER_T3_PHONE }}
      CUSTOMER_T3_PIN: ${{ secrets.CUSTOMER_T3_PIN }}
      QA_HOOKS_BASE_URL: ${{ vars.QA_HOOKS_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      # The APK is too large for git: CI downloads it from a link kept in the MOBILE_APK_URL secret
      # (e.g. a signed storage URL or the mobile team's build artifact link).
      - name: Fetch the app build
        id: apk
        env:
          MOBILE_APK_URL: ${{ secrets.MOBILE_APK_URL }}
          MOBILE_APK_TOKEN: ${{ secrets.MOBILE_APK_TOKEN }}
        run: |
          if [ -z "$MOBILE_APK_URL" ]; then
            echo "::warning::MOBILE_APK_URL secret is not set — mobile run skipped; the Mobile app tab will show 'No results yet'."
            echo "available=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p apps
          if [ -n "$MOBILE_APK_TOKEN" ]; then AUTH=(-H "Authorization: Bearer $MOBILE_APK_TOKEN"); else AUTH=(); fi
          curl -fsSL --retry 3 "${AUTH[@]}" -o apps/rosabon-dev.apk "$MOBILE_APK_URL"
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          VER="$("$AAPT" dump badging apps/rosabon-dev.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          CODE="$("$AAPT" dump badging apps/rosabon-dev.apk | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          echo "MOBILE_APP_LABEL=build $VER ($CODE)" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.apk.outputs.available == 'true'
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        if: steps.apk.outputs.available == 'true'
        with: { distribution: temurin, java-version: 17 }
      - name: Install dependencies, Appium and the Android driver
        if: steps.apk.outputs.available == 'true'
        run: |
          npm ci
          npm i -g appium@3.9.0
          appium driver install uiautomator2@8.7.3
      - name: Enable KVM (hardware-accelerated emulator)
        if: steps.apk.outputs.available == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run mobile suites on the emulator
        if: steps.apk.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: bash scripts/ci-mobile-run.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.apk.outputs.available == 'true'
        with:
          name: mobile-results
          path: |
            reports/mobile-results
            reports/mobile-screens
          retention-days: 30

  dev-portal-report:
    name: Dev Admin Portal + API run → public summary on Netlify (Admin, Mobile and API tabs)
    # Live dev portal: not on PRs (it creates approval requests on the shared dev system).
    # Waits for the mobile run so both tabs are filled; still publishes if that job fails or is skipped.
    needs: mobile-dev
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the refreshed site/index.html, which Netlify / Vercel deploy from git
    env:
      DEV_ADMIN_URL: ${{ vars.DEV_ADMIN_URL }}
      DEV_ADMIN_EMAIL: ${{ secrets.DEV_ADMIN_EMAIL }}
      DEV_ADMIN_PASSWORD: ${{ secrets.DEV_ADMIN_PASSWORD }}
      DEV_ALLOW_DESTRUCTIVE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run dev portal suite
        continue-on-error: true # failures are findings — still publish the summary
        env:
          PW_TEST_HTML_REPORT_OPEN: never
          PLAYWRIGHT_HTML_REPORT: reports/playwright-html
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/dev-final.json
        run: npx playwright test --project=admin-dev --reporter=json,html
      # Read-only checks of every GET endpoint in the backend's API document (api-dev/). Results feed the API tab.
      - name: Run API checks
        if: always()
        continue-on-error: true # failures are findings — still publish the summary
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://treasury-api-dev.rosabon-finance.com' }}
          CUSTOMER_T1_EMAIL: ${{ secrets.CUSTOMER_T1_EMAIL }}
          CUSTOMER_T1_PASSWORD: ${{ secrets.CUSTOMER_T1_PASSWORD }}
          CUSTOMER_T3_EMAIL: ${{ secrets.CUSTOMER_T3_EMAIL }}
          CUSTOMER_T3_PASSWORD: ${{ secrets.CUSTOMER_T3_PASSWORD }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/api-final.json
        run: npx playwright test --project=api-dev --reporter=json
      - name: Get the mobile results (if the mobile run produced any)
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with: { name: mobile-results, path: reports }
      - name: Build summary (internal + public)
        if: always()
        env:
          MOBILE_HOLD_PERSONAS: ${{ vars.MOBILE_HOLD_PERSONAS }}
          PUBLISH_GUARD: '1' # keeps the published page when admin sign-in failed or mobile produced nothing
        run: npm run report:summary
      - name: Keep the full report internal (GitHub artifact, not Netlify)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: dev-portal-report, path: reports/summary, retention-days: 30 }
      # Netlify / Vercel are linked to this repo and publish site/ (see netlify.toml, vercel.json).
      # Committing the refreshed page triggers their deploy; commits made with GITHUB_TOKEN don't re-run this workflow.
      - name: Publish the public summary (commit site/index.html)
        if: always()
        run: |
          if git diff --quiet -- site/index.html; then echo "Public summary unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html
          git commit -m "QA results: refresh public summary (run ${{ github.run_number }})"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 5; done
          echo "::error::Could not push the refreshed summary"; exit 1
