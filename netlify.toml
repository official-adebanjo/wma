# Netlify serves index.html at the root of the publish folder, so the plain-English
# test summary (Admin portal | Mobile app tabs) is the landing page.
#
# site/index.html is generated by `npm run report:summary` and COMMITTED (reports/ is git-ignored),
# so a site linked to the GitHub repo can publish it with no build step. CI refreshes and commits it
# after each nightly / main run. It holds ONLY the summary page — no screenshots, traces, videos,
# customer names or the technical report.

[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"
