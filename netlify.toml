# Netlify serves index.html at the root of the publish folder, so the plain-English
# test summary is the landing page.
#
# reports/site is produced by `npm run report:summary` and contains ONLY the summary page —
# no screenshots, traces, videos or technical report (those hold customer data and session tokens).
#
# The site is deployed from CI / the CLI (`npm run deploy:report`), not built by Netlify from git:
# the tests need dev credentials and browsers, and reports/ is git-ignored.
# In Netlify, create the site with "Deploy manually" (do not link it to the GitHub repo).

[build]
  publish = "reports/site"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"
